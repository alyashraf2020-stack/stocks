name: EGX regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt && python -m pip check
      - name: Install verified Caddy for HTTPS tests
        run: |
          release=https://github.com/caddyserver/caddy/releases/download/v2.11.9
          archive=caddy_2.11.9_linux_amd64.tar.gz
          curl -fsSLO "$release/$archive"
          curl -fsSLO "$release/caddy_2.11.9_checksums.txt"
          grep " $archive$" caddy_2.11.9_checksums.txt | sha512sum --check -
          tar -xzf "$archive" caddy
          sudo install caddy /usr/local/bin/caddy
      - name: Run regression with loopback as the only network
        run: sudo --preserve-env=PATH,LD_LIBRARY_PATH unshare --net sh -c 'ip link set lo up && exec "$1" -m pytest -q' sh "$(command -v python)"
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_TELEMETRY_DISABLED: '1'
